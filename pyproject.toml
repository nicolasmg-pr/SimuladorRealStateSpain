[project]
name = "resim"
version = "0.1.0"
description = "Agent-based simulation of a real estate market: actors, their interactions, and the price effects of policy interventions."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "requests>=2.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
resim = "resim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Protect prose from the formatter wherever it lives — `docs/` excluded the directory but
# left root-level README.md / CLAUDE.md exposed, and hid any future Python under docs/ from
# `ruff check` as a side effect. Markdown is the thing to exclude, not the folder.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
